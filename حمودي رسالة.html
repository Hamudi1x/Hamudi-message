<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حمودي رسالة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Tajawal:wght@400;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--sf:#f1f2f5;--tx:#111;--sub:#8a8f98;--ac:#2f9cf4;--out:#d9f2c6;--in:#fff;--wp:#bcd9a8;--bar:#ffffffe6;--ff:Roboto;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--sf:#1c1c1d;--tx:#f4f4f4;--sub:#8d9095;--out:#2b87e0;--in:#212121;--wp:#0a0a0c;--bar:#1c1c1de6}}
:root[data-theme="dark"]{--bg:#000;--sf:#1c1c1d;--tx:#f4f4f4;--sub:#8d9095;--out:#2b87e0;--in:#212121;--wp:#0a0a0c;--bar:#1c1c1de6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 var(--ff),Roboto,"Segoe UI",system-ui,sans-serif}
#app{height:100%;max-width:480px;margin:auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
button,input,select{font:inherit;color:inherit;border:0;background:none}
.top,.tabs,.bar,.msgs{direction:ltr}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:56px}
.top h1{margin:0;font-size:1.45em;flex:1;font-weight:700}
.ib{width:44px;height:44px;border-radius:50%;background:var(--bar);display:grid;place-items:center;font-size:19px;flex:none}
.sc{flex:1;overflow:auto;padding:0 12px 90px}
.search{width:100%;background:var(--sf);border-radius:24px;height:48px;padding:0 18px;margin:4px 0 8px}
.row{display:flex;align-items:center;gap:12px;padding:8px 4px;width:100%;direction:rtl;text-align:start}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;flex:none;object-fit:cover;overflow:hidden}
.rt{flex:1;min-width:0}.rt b{display:block}.rt span,.row small{color:var(--sub);font-size:.87em}.rt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{position:absolute;left:16px;bottom:88px;width:52px;height:52px;border-radius:50%;background:var(--ac);color:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 3px 10px #0005}
.tabs{position:absolute;bottom:8px;left:12px;right:12px;height:62px;background:var(--bar);backdrop-filter:blur(14px);border-radius:31px;display:flex;justify-content:space-around;align-items:center}
.tabs button{padding:6px 12px;border-radius:22px;font-size:12px;color:var(--tx);display:grid;justify-items:center}.tabs .on{background:#2f9cf433;color:var(--ac)}
.chat{position:relative;flex:1;display:flex;flex-direction:column;background:var(--wp);background-image:radial-gradient(circle at 20% 30%,#ffffff12 2px,transparent 3px),radial-gradient(circle at 70% 70%,#ffffff10 3px,transparent 4px);background-size:56px 56px,72px 72px;min-height:0}
.pill{flex:1;display:flex;align-items:center;gap:10px;background:var(--bar);border-radius:28px;padding:4px 16px 4px 10px;min-width:0;direction:ltr}.pill .av{width:40px;height:40px;font-size:16px}
.msgs{flex:1;overflow:auto;padding:8px 12px;display:flex;flex-direction:column;gap:4px}
.m{max-width:80%;padding:6px 10px;border-radius:var(--br,16px);font-size:var(--fs,15px);position:relative;background:var(--in);align-self:flex-start;user-select:none;word-break:break-word}
.m.out{background:var(--out);align-self:flex-end;color:#fff;border-bottom-right-radius:4px}
:root[data-theme="light"] .m.out{color:#111}
.m s{display:block;text-decoration:none;font-size:11px;opacity:.7;text-align:right}
.m q{display:block;border-left:3px solid var(--ac);padding-left:6px;margin-bottom:4px;font-size:13px;opacity:.85}
.m em{position:absolute;bottom:-10px;left:6px;background:var(--bar);border-radius:10px;padding:0 4px;font-style:normal}
.m img{max-width:100%;border-radius:10px;display:block}.m audio{height:36px;max-width:220px}
.bar{display:flex;align-items:center;gap:6px;margin:6px 8px 8px;background:var(--bar);border-radius:26px;padding:4px 8px}
.bar input{flex:1;height:44px;padding:0 6px;min-width:0}
.go{width:48px;height:48px;border-radius:50%;background:var(--ac);color:#fff;font-size:20px;flex:none}
.sheet{position:absolute;inset:0;background:#0007;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;z-index:5}
.rx,.act{background:var(--sf);border-radius:26px;padding:6px 10px;display:flex;gap:6px}.rx button{font-size:26px;padding:2px 4px}
.rx{max-width:94%;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap}.rx::-webkit-scrollbar{display:none}.rx button{flex:none}.m em{animation:pop .3s}
.burst{position:fixed;left:50%;top:45%;font-size:90px;z-index:50;pointer-events:none;animation:bu .9s ease-out forwards}@keyframes bu{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}
.sqb{width:44px;height:44px;border-radius:12px;background:#2f9cf433;color:var(--ac);display:grid;place-items:center;flex:none}
.act{flex-direction:column;border-radius:16px;width:230px;padding:6px}.act button{padding:11px 14px;text-align:start}
.emo{display:grid;grid-template-columns:repeat(8,1fr);background:var(--bar);margin:0 8px;border-radius:16px;padding:6px;font-size:24px;text-align:center}
.call{flex:1;background:linear-gradient(160deg,#2f9cf4,#6a5be8 60%,#8566e8);color:#fff;display:flex;flex-direction:column;align-items:center;padding-top:60px;position:relative}
.call video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.call>:not(video){position:relative}
.call .av{width:140px;height:140px;font-size:56px;margin-bottom:18px;box-shadow:0 0 0 14px #ffffff25}
.cb{margin-top:auto;display:flex;justify-content:space-around;width:100%;padding:0 12px 28px;direction:ltr}
.cb button{display:grid;justify-items:center;gap:6px;font-size:12px;color:#fff}.cb i{width:56px;height:56px;border-radius:50%;background:#ffffff40;display:grid;place-items:center;font-style:normal;font-size:22px}.cb .on i{background:#fff;color:#6a5be8}.cb .end i{background:#ee1c2c}
.f{display:grid;gap:10px;padding:16px}.f input,.f select{background:var(--sf);border-radius:14px;height:50px;padding:0 14px;width:100%}
.btn{background:var(--ac);color:#fff;border-radius:25px;height:50px;font-weight:700;width:100%}.btn.g{background:var(--sf);color:var(--tx)}
.lg{width:132px;height:132px;border-radius:30px;display:block;margin:48px auto 12px}
.ck{width:24px;height:24px;border-radius:50%;background:#34c759;color:#fff;display:grid;place-items:center;font-size:14px}
.toast{position:absolute;bottom:90px;left:24px;right:24px;background:#222;color:#fff;border-radius:14px;padding:10px 14px;text-align:center;z-index:9}
.note{color:var(--sub);font-size:.85em;text-align:center;padding:0 16px}.ln{color:var(--ac);text-align:center;padding:6px}
.pn{background:var(--bar);padding:6px 14px;font-size:13px;margin:0 8px;border-radius:12px}
[hidden]{display:none!important}.ic{display:block;flex:none}.rot{transform:rotate(135deg)}.go{display:grid;place-items:center}.pill2{display:flex;background:var(--bar);border-radius:28px;padding:0 4px;direction:ltr}.pill2 button{width:46px;height:48px;display:grid;place-items:center}.act button{display:flex;align-items:center;gap:12px}.ln .ic{margin:0 auto}
.tabs{padding:0 6px;background:color-mix(in srgb,var(--bar) 58%,transparent);border:1px solid #ffffff14}.tabs button{flex:1;position:relative;z-index:1}.tabs .on{background:none}.sl{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:24px;background:#2f9cf433;transition:transform .17s ease}
.sc.fd{animation:fi .22s ease}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.fab2{position:absolute;left:24px;bottom:148px;width:40px;height:40px;border-radius:50%;background:var(--bar);display:grid;place-items:center;box-shadow:0 2px 8px #0004}
.cd{transition:.15s}.cd:focus{outline:2px solid var(--ac);transform:scale(1.08)}.fl{animation:pop .2s}@keyframes pop{50%{transform:scale(1.18)}}
.demo{position:absolute;top:0;left:0;right:0;background:#f5a623;color:#000;text-align:center;font-size:12px;padding:2px;z-index:8}
.ep{background:var(--bar);margin:0 8px;border-radius:16px;padding:6px;height:250px;display:flex;flex-direction:column}.eg{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(8,1fr);font-size:24px;text-align:center;align-content:start}.eg.st{grid-template-columns:repeat(4,1fr);font-size:48px}.et{display:flex;justify-content:center;gap:6px}.et button{padding:8px 14px;border-radius:20px}.et .on{background:var(--sf)}
.cam{flex:1;position:relative;background:#000;color:#fff;display:flex;flex-direction:column}.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cam>:not(video){position:relative}.cam .r{display:flex;justify-content:space-around;align-items:center;margin-top:auto;padding:16px}.shut{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff3}.shut.v{background:#f33}.mds{display:flex;justify-content:center;gap:10px;padding-bottom:20px}.mds button{padding:8px 18px;border-radius:20px}.mds .on{background:#fff3}
.st-row{display:flex;align-items:center;gap:14px;padding:12px 6px;width:100%;direction:rtl;text-align:start}.sq{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.sbtn{flex:1;height:48px;border-radius:24px;background:var(--bar);display:flex;align-items:center;justify-content:center;gap:8px}
.mw{display:flex;align-items:center;gap:8px;padding:2px 0}.mw.sel{background:#2f9cf433;margin:0 -12px;padding:2px 12px}.mw .m{align-self:auto;margin-left:auto}.cc{width:22px;height:22px;border-radius:50%;border:2px solid #fff8;display:grid;place-items:center;flex:none;font-style:normal}.cc.on{background:#34c759;border-color:#34c759;color:#fff}
.ps *{animation:none!important;transition:none!important;box-shadow:none!important;backdrop-filter:none!important}
.cardf{background:var(--sf);border-radius:20px;padding:6px 14px;margin:8px 0}.ct{color:var(--ac);font-weight:700;padding:10px 4px 2px}.fi{background:none;width:100%;height:46px;padding:0 4px;border-bottom:1px solid #8884;border-radius:0}
.sw{width:46px;height:26px;border-radius:13px;background:#6668;position:relative;flex:none}.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--ac)}.sw.on i{left:23px}
.big .av{width:120px;height:120px;font-size:46px;margin:auto}.cam-badge{position:absolute;bottom:2px;right:2px;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pg img,.pg video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px}.seg{display:flex;gap:4px;background:var(--sf);border-radius:22px;padding:4px;width:max-content;margin:12px auto}.seg button{padding:8px 18px;border-radius:18px}.seg .on{background:#2f9cf433;color:var(--ac)}
.chips{display:flex;gap:10px;flex-wrap:wrap;padding:8px 0}.chips i{width:34px;height:34px;border-radius:50%;display:block;border:2px solid transparent}.chips i.on{border-color:var(--tx)}.thm{display:flex;gap:8px;overflow:auto;padding:8px 0}.thm i{flex:none;width:96px;height:130px;border-radius:12px;border:2px solid transparent;display:grid;place-items:center;align-content:center;font-style:normal;font-size:30px;background:#111}.thm i.on{border-color:var(--ac)}
.rov{position:fixed;inset:0;max-width:480px;margin:auto;z-index:30;pointer-events:none}.rov>*{pointer-events:auto}.rov .vrw{position:absolute;inset:0 0 90px 0;pointer-events:none;display:grid;place-items:center;background:#000d}.cv{width:min(92%,380px);aspect-ratio:1;border-radius:50%;overflow:hidden;position:relative;background:#222}.cv video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rb{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));height:56px;background:var(--bar);backdrop-filter:blur(12px);border-radius:28px;display:flex;align-items:center;gap:8px;padding:0 8px;direction:ltr}.rsend{position:absolute;right:8px;bottom:calc(2px + env(safe-area-inset-bottom,0px));width:76px;height:76px;box-shadow:0 0 0 10px #2f9cf455}
.m video.vcb{width:220px;height:220px;border-radius:50%;object-fit:cover;display:block}
.fh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}.dlgw{position:fixed;inset:0;max-width:480px;margin:auto;z-index:40;background:#0007;display:flex;align-items:center;justify-content:center}
.at{position:absolute;left:0;right:0;bottom:0;height:60%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;z-index:6;box-shadow:0 -4px 20px #0006}.at .abody{flex:1;overflow:auto;padding:8px}.atabs{display:flex;gap:2px;overflow:auto;margin:6px 8px 8px;background:var(--bar);border-radius:28px;padding:4px;direction:ltr}.atabs button{flex:none;display:grid;justify-items:center;padding:6px 12px;border-radius:22px;font-size:12px}.atabs .on{background:#2f9cf433;color:var(--ac)}
.tile{display:grid;place-items:center;align-content:center;aspect-ratio:1;background:var(--sf);border-radius:8px;color:var(--ac);text-align:center;font-size:12px}.pgl{position:relative}.sel2{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;background:#0004;color:#fff}.sel2.on{background:var(--ac)}
.gg{font:700 20px Arial,sans-serif;background:conic-gradient(from -45deg,#ea4335 0 25%,#4285f4 0 50%,#34a853 0 75%,#fbbc05 0);-webkit-background-clip:text;background-clip:text;color:transparent}.btn.gb{background:#fff;color:#222;border:1px solid #dadce0;display:flex;align-items:center;justify-content:center;gap:10px}
.ib .av{width:36px;height:36px;font-size:15px}.m.sk{background:none!important;padding:0}.m.sk img{width:150px;border-radius:0}
.spl{flex:1;display:grid;place-items:center}
.cd{width:46px;height:56px;border-radius:12px;background:var(--sf);text-align:center;font-size:1.4em;font-weight:700;padding:0}.spl img{width:160px;border-radius:36px}
</style>
</head>
